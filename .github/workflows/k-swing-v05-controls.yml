name: K-SWING v0.5 controlled historical validation

on:
  push:
    branches: [research/k-swing-v05]
    paths:
      - 'research/k_swing/controls_v05.py'
      - 'research/k_swing/tests/test_controls_v05.py'
      - '.github/workflows/k-swing-v05-controls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-real-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated dependencies
        run: python -m pip install -r research/k_swing/requirements.txt
      - name: Test price, factor, PIT and new controls
        run: python -m pytest -q research/k_swing/tests
      - name: Download only 2017-2023 real KRX-derived daily bars privately
        run: |
          python -m research.k_swing.marcap_ingest \
            --start-year 2017 --end-year 2023 --keep-raw \
            --output "$RUNNER_TEMP/k-swing-v05"
      - name: Check historical price discontinuities and session calendar
        run: |
          python -m research.k_swing.quality_audit \
            --start-year 2017 --end-year 2023 \
            --data "$RUNNER_TEMP/k-swing-v05"
      - name: Neutralize market and size / evaluate liquidity and cost stress
        run: |
          python -m research.k_swing.controls_v05 \
            --data "$RUNNER_TEMP/k-swing-v05" \
            --output "$RUNNER_TEMP/k-swing-v05/aggregate-reports" \
            --modulus 8
      - name: Summarize 2023 (previously inspected) without revealing stocks
        run: |
          mkdir -p ./k-swing-v05-safe-summary
          cp "$RUNNER_TEMP/k-swing-v05/aggregate-reports/"* ./k-swing-v05-safe-summary/
          python - <<'PY'
          import json,os
          from pathlib import Path
          import pandas as pd
          root=Path('k-swing-v05-safe-summary')
          s=json.loads((root/'v05_summary.json').read_text())
          r=pd.read_csv(root/'v05_market_size_cost_aggregates.csv')
          year=r.loc[r.year.eq(2023)&r.horizon.eq(10)&r.top_k.eq(10)]
          lines=[
              '# v0.5 size/market-controlled low-volatility pilot', '',
              f"Sample symbol codes: **{s['stock_codes']}**",
              f"Signal ticker-days: **{s['signal_stock_days']:,}**",
              '**2026 confirmation holdout not opened.**', '',
              '## 2023 reused exploratory validation (10 sessions, Top-10)',
              '| Prior-selected factor | Raw Rank IC | Size/market controlled IC | Gross average | Approx after 100 bps | Prior-day capacity pass % |',
              '|---|---:|---:|---:|---:|---:|'
          ]
          for _,x in year.iterrows():
              lines.append(
                  f"| {x['factor']} | {x['raw_rank_ic']:.4f} | "
                  f"{x['market_size_neutral_rank_ic']:.4f} | {x['mean_selected_gross']*100:.3f}% | "
                  f"{x['mean_after_100bps']*100:.3f}% | {x['signal_turnover_capacity_pass_fraction']*100:.1f}% |"
              )
          lines.extend(['',
              'Cost scenarios: hypothetical round-trip 20/50/100/200 bps, NOT official actual schedules.',
              'Market/size-neutral rank correlations DO NOT create a neutral executable portfolio.',
              'Prior-day turnover capacity is a screen, not proof of next-day fillability.',
              'Sector classification and verified split-adjusted/delisted security reference data remain absent.',
              'No individual ticker, raw prices or order intent published.'])
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines)+'\n')
          PY
      - name: Remove private ticker-day and raw data
        if: always()
        run: rm -rf "$RUNNER_TEMP/k-swing-v05/_raw" "$RUNNER_TEMP/k-swing-v05/_private"
      - uses: actions/upload-artifact@v4
        with:
          name: k-swing-v05-size-cost-safe-aggregates
          path: ./k-swing-v05-safe-summary/
          retention-days: 7

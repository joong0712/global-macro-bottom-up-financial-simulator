name: K-SWING v0.6 leaderboard independent job

on:
  push:
    branches: [research/k-swing-v06]
    paths:
      - "research/k_swing/rankings_v06.py"
      - "research/k_swing/tests/test_rankings_v06.py"
      - ".github/workflows/k-swing-v06-rankings.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  leaderboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: python -m pip install -r research/k_swing/requirements.txt
      - name: Validate ranking and no-holdout logic
        run: python -m pytest -q research/k_swing/tests/test_rankings_v06.py
      - name: Retrieve historical aggregate metrics only from confirmed run 42871531605
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/kswing-v04-aggregates"
          gh run download 42871531605 --repo "${{ github.repository }}" \
            --name "kswing-188-factor-2019-2023-aggregate-pilot" \
            --dir "$RUNNER_TEMP/kswing-v04-aggregates"
          test -s "$RUNNER_TEMP/kswing-v04-aggregates/factor_pilot_aggregates.csv"
          test -s "$RUNNER_TEMP/kswing-v04-aggregates/factor_pilot_training_ranks.csv"
      - name: Rank all 188 factors separately for 5d/10d and K=1,3,5,10,20
        run: |
          python -m research.k_swing.rankings_v06 \
            --source "$RUNNER_TEMP/kswing-v04-aggregates" \
            --output "$RUNNER_TEMP/kswing-v06-rankings"
      - name: Publish exploratory winners and anti-overfit warnings
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          root=Path(os.environ["RUNNER_TEMP"])/"kswing-v06-rankings"
          df=pd.read_csv(root/"factor_leaderboard_188_v06.csv")
          top=df.loc[df.exploratory_2023_excess_rank.eq(1)].sort_values(["horizon","top_k"])
          lines=[
            "# v0.6 — 188-indicator retrospective excess-return ranking", "",
            "**2023 was already inspected; rankings are exploratory and not an untouched holdout.**",
            "", "| Future horizon | Daily picks K | Posthoc best factor (train-fixed direction) | 2023 avg gross excess |",
            "|---:|---:|---|---:|"
          ]
          for _,r in top.iterrows():
            lines.append(f"| {int(r.horizon)}d | {int(r.top_k)} | {r.factor} | {r.explored_2023_avg_excess_gross*100:.3f}%p |")
          lines += ["", "Gross excess is per overlapping future outcome window, NOT portfolio profit.",
                    "Selection by the maximum of 188 factors × 2 horizons × 5 K is heavily multiple-tested.",
                    "No 2024–2026 data read; especially 2026 confirmation remains locked."]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: k-swing-v06-full-188-indicator-retrospective-ranks
          path: ${{ runner.temp }}/kswing-v06-rankings/
          retention-days: 7
